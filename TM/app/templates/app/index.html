<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>タスク管理</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
        }

        form.add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
        }

        input[type="datetime-local"] {
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .task-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .actions a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>タスク管理</h1>

    <!-- タスク追加 -->
    <form method="POST" class="add-task">
        {% csrf_token %}

        <input
            type="text"
            name="title"
            placeholder="タスクを入力"
            required
        >

        <input
            type="datetime-local"
            name="due_date"
        >

        <button type="submit">追加</button>
    </form>


    <!-- タスク一覧 -->
    {% for task in tasks %}

        <div class="task">

            <div class="task-info">
    <span class="{% if task.completed %}completed{% endif %}">
        {{ task.title }}
    </span>

    {% if task.due_date %}
        <span style="font-weight: bold; color: #333;">
            (期限：{{ task.due_date|date:"Y年n月j日 H:i" }})
        </span>
    {% else %}
        <span style="color: #999;">
            （期限なし）
        </span>
    {% endif %}
</div>

            </div>


            <div class="actions">

                {% if task.completed %}
                    <a href="{% url 'complete' task.id %}">
                        <button>未完了に戻す</button>
                    </a>
                {% else %}
                    <a href="{% url 'complete' task.id %}">
                        <button>完了</button>
                    </a>
                {% endif %}

                <a href="{% url 'delete' task.id %}">
                    <button>削除</button>
                </a>

            </div>

        </div>

    {% empty %}

        <p>タスクはありません。</p>

    {% endfor %}

</body>
</html>
